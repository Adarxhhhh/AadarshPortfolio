        <span>GitHub</span>
      </a>

      <a
        class="contact-pill"
        href="https://x.com/katigi_adarsh"
        target="_blank"
        rel="noreferrer"
        aria-label="Twitter / X"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18.9 2h3.1l-6.8 7.8L23.5 22h-6.4l-5-6.5L5.5 22H2.4l7.3-8.4L.8 2h6.6l4.5 5.9L18.9 2Zm-1.1 18h1.7L7.5 4h-1.8l12.1 16Z"

      <a
        class="contact-pill"
        href="mailto:katigiaadarshm@gmail.com"
        aria-label="Email"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.5l8 5 8-5V7H4Zm16 10v-7.3l-8 5-8-5V17h16Z"

        <span>Email</span>
      </a>
    </div>
  </div>

  <!-- Contact Form -->
  <div class="contact-form-wrapper">
    <h3>Or drop me a message</h3>
    <form
      class="contact-form"
      action="https://formspree.io/f/mjgabgje"
      method="POST"
    >
      <div class="form-row">
        <div class="form-group">
          <label for="contact-name">Name</label>
          <input
            type="text"
            id="contact-name"
            name="name"
            placeholder="Your name"
            required
            autocomplete="name"
          />
        </div>
        <div class="form-group">
          <label for="contact-email">Email</label>
          <input
            type="email"
            id="contact-email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>
      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea
          id="contact-message"
          name="message"
          placeholder="What would you like to discuss?"
          rows="5"
          required
        ></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-submit">
        Send Message
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"
          />
        </svg>
      </button>
    </form>
  </div>
</section>
