<section id="education" class="section">
  <div class="section-header">
    <h2>Education</h2>
  </div>

  <div class="education-grid">
    <button
      type="button"
      class="education-card flip-card"
      aria-pressed="false"
      aria-label="University of Massachusetts Boston education card. Click to flip and view coursework."
    >
      <span class="flip-inner">
        <span class="flip-face flip-front">
          <img
            class="education-logo"
            src="assets/UMassBostonLogo.png"
            alt="UMass Boston logo"
          />
          <h3>MS Computer Science</h3>
          <p>University of Massachusetts Boston</p>
          <span class="edu-years">2023 – 2025</span>
          <span class="flip-hint">Click to view coursework</span>
        </span>

        <span class="flip-face flip-back">
          <div class="flip-back-header">
            <h3>Coursework</h3>
            <span class="flip-hint">Click to flip back</span>
          </div>
          <ul class="course-list">
            <li>Machine Learning</li>
            <li>Artificial Intelligence</li>
            <li>Distributed Systems</li>
            <li>Operating Systems</li>
            <li>Advanced Neural Networks</li>
            <li>Object Oriented Design</li>
          </ul>
        </span>
      </span>
    </button>

    <button
      type="button"
      class="education-card flip-card"
      aria-pressed="false"
      aria-label="Visvesvaraya Technological University education card. Click to flip and view coursework."
    >
      <span class="flip-inner">
        <span class="flip-face flip-front">
          <img
            class="education-logo"
            src="assets/VisvesvarayaTechUniLogo.webp"
            alt="Visvesvaraya Technological University logo"
          />
          <h3>BE Computer Science</h3>
          <p>Visvesvaraya Technological University</p>
          <span class="edu-years">2017 – 2021</span>
          <span class="flip-hint">Click to view coursework</span>
        </span>

        <span class="flip-face flip-back">
          <div class="flip-back-header">
            <h3>Coursework</h3>
            <span class="flip-hint">Click to flip back</span>
          </div>
          <ul class="course-list">
            <li>Object Oriented Programming</li>
            <li>Computer Networks</li>
            <li>DBMS</li>
            <li>Operating Systems</li>
            <li>Python Programming</li>
            <li>Software Design</li>
          </ul>
        </span>
      </span>
    </button>
  </div>
</section>
